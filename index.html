<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Цветы с доставкой по Москве — авторские букеты A.FLOWERS</title>
    <meta name="description" content="A.FLOWERS — московская цветочная студия. Авторские букеты и композиции под ваш повод, свежие цветы под заказ, доставка по Москве. Подбор букета и заказ через Telegram, WhatsApp, Instagram или почту." />
    <meta name="theme-color" content="#3E0A10" />
    <link rel="preload" as="image" href="/images/velvet-tile.jpg" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A.FLOWERS" />
    <meta property="og:title" content="Цветы с доставкой по Москве — авторские букеты A.FLOWERS" />
    <meta property="og:description" content="Авторские букеты и композиции под ваш повод. Свежие цветы под заказ, доставка по Москве. Заказ через Telegram, WhatsApp, Instagram или почту." />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ru_RU" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Статичный конверт до загрузки JS: первый экран рисуется сразу из HTML+CSS (LCP),
         React заменяет его на анимированную версию и удаляет этот блок. -->
    <style>
      #pre-hero{position:fixed;inset:0;z-index:0;display:grid;grid-template-rows:1fr auto 1fr;justify-items:center;align-items:center;background:#3e0a10;pointer-events:none}
      #pre-hero .ph-scene{grid-row:2;width:calc(min(620px,78vw) + 4px);aspect-ratio:600/420;position:relative}
      #pre-hero .ph-env{position:absolute;inset:0;background:#4e0d15 url(/images/velvet-tile.jpg);background-size:220px;background-blend-mode:soft-light;border-radius:3px;box-shadow:0 30px 60px -20px rgba(10,2,4,.7)}
      #pre-hero .ph-f{position:absolute;inset:0}
      #pre-hero .ph-f{background-color:#5a0f19;background-size:220px,100% 100%;background-blend-mode:soft-light,normal}
      #pre-hero .ph-l{clip-path:polygon(0 0,50% 57%,0 100%);background-image:url(/images/velvet-tile.jpg),linear-gradient(90deg,#3f0910,#5a0f19 45%,#661423)}
      #pre-hero .ph-r{clip-path:polygon(100% 0,50% 57%,100% 100%);background-image:url(/images/velvet-tile.jpg),linear-gradient(270deg,#3f0910,#5a0f19 45%,#641322)}
      #pre-hero .ph-b{clip-path:polygon(0 100%,50% 48%,100% 100%);background-image:url(/images/velvet-tile.jpg),linear-gradient(180deg,#6a1524,#58101a 55%,#3e0910)}
      #pre-hero .ph-t{clip-path:polygon(0 0,100% 0,50% 60%);background-image:url(/images/velvet-tile.jpg),linear-gradient(180deg,#6b1524,#5a0f19 60%,#3f0910)}
      #pre-hero .ph-seal{position:absolute;left:50%;top:60%;width:24%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 38% 32%,#a8303a,#8e1b22 55%,#5e0e14);box-shadow:0 0 0 4px #9c6a36,0 6px 10px rgba(10,2,4,.45)}
      @media (max-width:767px){#pre-hero .ph-scene{width:calc(88vw + 4px)}}
      @media (max-height:640px){#pre-hero .ph-scene{width:calc(min(520px,60vw) + 4px)}}
    </style>
    <div id="pre-hero" aria-hidden="true">
      <div class="ph-scene"><div class="ph-env"><div class="ph-f ph-l"></div><div class="ph-f ph-r"></div><div class="ph-f ph-b"></div><div class="ph-f ph-t"></div><div class="ph-seal"></div></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
